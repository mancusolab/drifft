[project]
strict = true
site_name = "drifft"
site_description = "Differentiable, matrix-free Wright–Fisher transitions in JAX."
repo_url = "https://github.com/mancusolab/drifft"
repo_name = "mancusolab/drifft"
edit_uri = ""
extra_css = ["_static/custom.css"]
extra_javascript = ["_static/mathjax.js", "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"]
nav = [
    "index.md",
    { "User guide" = [
        "guide/installation.md",
        "guide/quickstart.md",
        "guide/transitions.md",
        "guide/backends.md",
        "guide/numerics.md",
        "guide/solves.md",
    ] },
    { "Python API reference" = ["api/transitions.md", "api/backends.md"] },
    { "Project" = ["benchmarks.md", "contributing.md"] },
]

[project.theme]
variant = "classic"
features = ["navigation.sections", "toc.integrate", "header.autohide", "content.code.copy"]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle = { icon = "material/brightness-7", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle = { icon = "material/brightness-4", name = "Switch to light mode" }

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.toc]
permalink = "¤"
toc_depth = 4

[project.plugins.search]
[project.plugins.autorefs]
[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
force_inspection = true
show_source = false
heading_level = 2
show_root_heading = true
show_symbol_type_heading = true
show_symbol_type_toc = true
inherited_members = true
members_order = "source"
docstring_style = "google"
show_if_no_docstring = true
annotations_path = "brief"
show_signature_annotations = true
