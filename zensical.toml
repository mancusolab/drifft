[project]
strict = true
site_name = "drifft"
site_description = "Differentiable, matrix-free Wright–Fisher transitions in JAX."
repo_url = "https://github.com/mancusolab/drifft"
repo_name = "mancusolab/drifft"
edit_uri = ""
extra_css = ["_static/custom.css"]
extra_javascript = ["_static/mathjax.js", "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"]
nav = [
    { "drifft" = [
        { "Quickstart" = "index.md" },
        "guide/frequency_maps.md",
        "guide/transitions.md",
        "guide/demography.md",
        "guide/backends.md",
        "guide/numerics.md",
        "guide/solves.md",
        "guide/epochs.md",
    ] },
    { "Examples" = [
        "examples/allele_loss.md",
        "examples/bottleneck.md",
        "examples/selection_sensitivity.md",
        "examples/schiffels_durbin.md",
    ] },
    { "Python API reference" = [
        "api/transitions.md",
        "api/demography.md",
        "api/frequency_maps.md",
        "api/backends.md",
        "api/methods.md",
    ] },
    { "Numerical methods" = [
        "guide/notation.md",
        "guide/model.md",
        "methods/overview.md",
        "methods/fft.md",
        "methods/nufft.md",
        "methods/jacobi.md",
        "methods/jacobi_krylov.md",
        "methods/autodiff.md",
    ] },
    { "Project" = ["benchmarks.md", "contributing.md"] },
]

[project.theme]
variant = "classic"
custom_dir = "docs/_static/overrides"
features = ["navigation.sections", "toc.integrate", "header.autohide", "content.code.copy"]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep orange"
accent = "deep orange"
toggle = { icon = "material/brightness-7", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep orange"
accent = "deep orange"
toggle = { icon = "material/brightness-4", name = "Switch to light mode" }

[project.theme.icon]
logo = "lucide/chart-line"
repo = "fontawesome/brands/github"

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.toc]
permalink = "¤"
toc_depth = 4

[project.plugins.search]
[project.plugins.autorefs]
[project.plugins.mkdocstrings]
custom_templates = "docs/_static/templates"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
force_inspection = true
show_source = false
heading_level = 4
show_root_heading = true
show_symbol_type_heading = true
show_symbol_type_toc = true
filters = ["!^_", "^__init__$"]
inherited_members = true
members_order = "source"
docstring_style = "google"
show_if_no_docstring = true
line_length = 80
modernize_annotations = false
annotations_path = "brief"
show_overloads = false
show_signature_annotations = true
separate_signature = false
