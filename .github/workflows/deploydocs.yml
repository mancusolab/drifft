name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "README.md"
      - "pyproject.toml"
      - "uv.lock"
      - "zensical.toml"
      - ".github/workflows/deploydocs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Keep cached FINUFFT builds portable across hosted-runner CPUs.
  CMAKE_ARGS: "-DFINUFFT_ARCH_FLAGS="

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6.0.0

      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.24"
          enable-cache: true
          cache-suffix: finufft-portable-v1

      - name: Install FFTW development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev

      - name: Install package and documentation dependencies
        run: uv sync --locked --group docs

      - name: Build docs
        run: uv run --locked --group docs zensical build --strict --clean

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

      - uses: actions/deploy-pages@v5.0.0
        id: deployment
