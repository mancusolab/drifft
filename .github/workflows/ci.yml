name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Cached FINUFFT builds must run on different hosted-runner CPUs.
      # Match jax-finufft's portable wheel builds instead of -march=native.
      CMAKE_ARGS: "-DFINUFFT_ARCH_FLAGS="
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.24"
          python-version: ${{ matrix.python-version }}
          # Do not restore wheels previously compiled for a runner's native CPU.
          cache-suffix: finufft-portable-v1
      - name: Install FFTW development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev
      - run: uv sync --locked
      - run: uv run pre-commit run --all-files
      - run: uv run pytest -p no:capture -v
      - run: uv build
